server.port=8080

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/voting_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration (HMAC-SHA256 256-bit+ secure secret)
jwt.secret=4c7d9a1e8f2b5a6c3d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c
jwt.expiration=86400000

# Logging
logging.level.com.voting=DEBUG
logging.level.org.springframework.security=DEBUG

# Razorpay Payment Gateway Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_5174OnlineVoteKey}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:5174OnlineVoteSecret}
razorpay.currency=INR
razorpay.nomination.fee=50000

