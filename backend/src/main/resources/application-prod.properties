# ==============================================================================
# PRODUCTION PROFILE CONFIGURATION (Secure Deployment)
# ==============================================================================
# In production, Admin credentials MUST be supplied exclusively via environment
# variables. Never use fallback credentials. Startup will abort if missing or blank.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

# Enforce secure logging in production
logging.level.com.voting=INFO
logging.level.org.springframework.security=WARN
spring.jpa.show-sql=false
